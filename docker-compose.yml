version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agrolink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrolink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrolink}
      POSTGRES_DB: ${POSTGRES_DB:-agrolink}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrolink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: agrolink_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrolink}:${POSTGRES_PASSWORD:-agrolink}@db:5432/${POSTGRES_DB:-agrolink}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres-data:
