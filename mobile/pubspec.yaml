  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  web_socket_channel: ^2.4.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
