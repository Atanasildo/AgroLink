services:
  - type: web
    name: agrolink-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrolink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "https://agro-link-eight.vercel.app,http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /health

databases:
  - name: agrolink-db
    databaseName: agrolink
    user: agrolink
    plan: free
