services:
  # ── Backend FastAPI ─────────────────────────────────────────
  - type: web
    name: agrolink-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrolink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "https://agrolink.vercel.app,http://localhost:3000"
    healthCheckPath: /health

databases:
  # ── PostgreSQL gerenciado pelo Render ───────────────────────
  - name: agrolink-db
    databaseName: agrolink
    user: agrolink
    plan: free
